name: Deploy Worker

on:
  push:
    branches: [main]
    paths: ["worker/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Applique les migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply tikvo_db --remote
      - name: Pousse les secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          put() { printf '%s' "$2" | npx wrangler secret put "$1" >/dev/null; }
          put TIKTOK_CLIENT_KEY "${{ secrets.TIKTOK_CLIENT_KEY }}"
          put TIKTOK_CLIENT_SECRET "${{ secrets.TIKTOK_CLIENT_SECRET }}"
          put RENDER_SECRET "${{ secrets.RENDER_SECRET }}"
          put GH_DISPATCH_TOKEN "${{ secrets.GH_DISPATCH_TOKEN }}"
          put PEXELS_API_KEY "${{ secrets.PEXELS_API_KEY }}"
      - name: Déploie le Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

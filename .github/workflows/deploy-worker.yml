name: Deploy Worker

on:
  push:
    branches: [ "main" ]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install root deps
        run: npm install --legacy-peer-deps

      - name: Install worker deps
        working-directory: worker
        run: npm install --legacy-peer-deps || npm install

      - name: Check D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 list --json | grep -q "5785d247-0933-4772-8241-1c205e07022a" && echo "✅ D1 found" || echo "⚠️ D1 not found in this account"

      - name: Apply D1 schema (non-blocking)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: worker
        run: |
          if [ -d "migrations" ]; then
            echo "Migrations folder found, applying..."
            npx wrangler d1 migrations apply tikvo_db --remote || echo "Migration failed but continuing"
          else
            echo "No migrations folder, applying schema.sql directly..."
            if [ -f "schema.sql" ]; then
              npx wrangler d1 execute tikvo_db --remote --file=./schema.sql || echo "Schema apply failed but tables already exist"
            else
              echo "No schema.sql, skipping (tables already created via console)"
            fi
          fi

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: worker
        run: |
          npx wrangler deploy --compatibility-date=2024-10-01

      - name: Show Worker URL
        run: echo "Check Cloudflare Dashboard > Workers for URL"

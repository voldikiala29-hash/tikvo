name: Deploy Worker

on:
  push:
    branches: [main]
    paths: ["worker/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dépendances (wrangler est dans les dépendances de la racine)
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Crée la base D1 si besoin
        run: npx wrangler d1 create tikvo || true
      - name: Applique les migrations
        run: npx wrangler d1 migrations apply tikvo --remote --config worker/wrangler.toml
      - name: Pousse les secrets
        run: |
          set -e
          put() { printf '%s' "$2" | npx wrangler secret put "$1" --config worker/wrangler.toml >/dev/null; }
          put TIKTOK_CLIENT_KEY "${{ secrets.TIKTOK_CLIENT_KEY }}"
          put TIKTOK_CLIENT_SECRET "${{ secrets.TIKTOK_CLIENT_SECRET }}"
          put RENDER_SECRET "${{ secrets.RENDER_SECRET }}"
          put GH_DISPATCH_TOKEN "${{ secrets.GH_DISPATCH_TOKEN }}"
          put PEXELS_API_KEY "${{ secrets.PEXELS_API_KEY }}"
      - name: Déploie le Worker
        run: npx wrangler deploy --config worker/wrangler.toml

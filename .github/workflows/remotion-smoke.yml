name: Remotion smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: render
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        run: npm install --no-audit --no-fund
      - name: Render smoke video
        run: npm run smoke
      - uses: actions/upload-artifact@v4
        with:
          name: remotion-smoke
          path: render/out/smoke.mp4
          if-no-files-found: error

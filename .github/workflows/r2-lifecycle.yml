name: R2 lifecycle (suppression après 7 jours)

# Lancement manuel uniquement. Règle sur tout le bucket tikvo-media : les objets
# (voix, photos et vidéos des utilisateurs) sont supprimés 7 jours après leur création.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remplace la règle d'expiration (idempotent)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Supprime l'éventuelle règle précédente (absente la première fois), puis l'ajoute.
          npx -y wrangler@4 r2 bucket lifecycle remove tikvo-media --name expire-7-days --force || true
          npx -y wrangler@4 r2 bucket lifecycle add tikvo-media expire-7-days --expire-days 7 --force
      - name: Vérifie la règle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4 r2 bucket lifecycle list tikvo-media

name: Render video

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Identifiant du job (UUID)"
        required: true
        type: string
      api_url:
        description: "URL du Worker tikvo-api"
        required: true
        type: string

concurrency:
  group: render-${{ inputs.job_id }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      JOB_ID: ${{ inputs.job_id }}
      API_URL: ${{ inputs.api_url }}
      RENDER_SECRET: ${{ secrets.RENDER_SECRET }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      # Dès le départ, la carte du site quitte « En file d’attente » : le serveur de rendu est lancé.
      - name: Signale le démarrage
        run: |
          curl -sS -m 10 -X POST "$API_URL/internal/jobs/$JOB_ID" \
            -H "Authorization: Bearer $RENDER_SECRET" -H "Content-Type: application/json" \
            -d '{"status":"rendering","step":"Préparation du serveur de rendu…","progress":2}' || true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dépendances système (ffmpeg, polices) si absentes
        run: |
          # N'installe que ce qui manque (apt-get update est l'étape la plus lente).
          MISSING=""
          for pkg in ffmpeg fonts-dejavu-core fonts-liberation; do
            dpkg -s "$pkg" >/dev/null 2>&1 || MISSING="$MISSING $pkg"
          done
          if [ -n "$MISSING" ]; then
            sudo apt-get update -y
            sudo apt-get install -y --no-install-recommends $MISSING
          else
            echo "ffmpeg et polices déjà présents"
          fi

      - name: "Dépendances Python (voix off : Edge TTS, repli gTTS)"
        run: |
          # Dernières versions : Microsoft change régulièrement le jeton qui évite le 403.
          pip install --quiet --upgrade edge-tts gtts
          python3 -c "import importlib.metadata as m; print('edge-tts', m.version('edge-tts'), '| gtts', m.version('gtts'))"

      # Pas de lockfile : node_modules est gardé en cache tant que package.json ne change pas.
      # Inclut le navigateur Remotion s'il est installé dans node_modules.
      - name: Cache node_modules
        id: nodemods
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: Dépendances Node
        if: steps.nodemods.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Vérifie que le rendu peut démarrer
        run: npm run pipeline:test

      - name: Rendu de la vidéo
        run: npm run pipeline:render

name: CI

on:
  pull_request:
  push:
    branches: [main, "feat/**", "fix/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps
      - name: YAML des workflows valide
        run: |
          pip install --quiet pyyaml
          python3 - <<'PY'
          import glob, sys, yaml
          bad = 0
          for path in sorted(glob.glob('.github/workflows/*.yml')):
              try:
                  data = yaml.safe_load(open(path, encoding='utf-8'))
              except yaml.YAMLError as err:
                  print(f'{path} : YAML invalide : {err}'); bad += 1; continue
              if not isinstance(data, dict) or (True not in data and 'on' not in data):
                  print(f'{path} : aucun déclencheur (on:)'); bad += 1
          sys.exit(1 if bad else 0)
          PY
      - name: Tests unitaires du pipeline
        run: npm run pipeline:test
      - name: Build du site
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      - name: "Types du Worker (non bloquant, à corriger : voir le journal du job)"
        continue-on-error: true
        run: npm run worker:typecheck

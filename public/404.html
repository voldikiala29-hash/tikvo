<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>tikvo - redirection...</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License - https://github.com/rafgraph/spa-github-pages
      // This script takes the current url and converts the path and query
      // into just a query string, then redirects the browser to the new url
      // with only a query string and hash fragment, e.g.
      // https://voldikiala29-hash.github.io/tikvo/radar becomes
      // https://voldikiala29-hash.github.io/tikvo/?/radar
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>

    <!-- SPA route restore script for GitHub Pages (HashRouter compatible) -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.location.replace(
            l.pathname + '#' + decoded + (l.hash ? l.hash.replace(/^#/, '') : '')
          );
        }
      }(window.location))
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
